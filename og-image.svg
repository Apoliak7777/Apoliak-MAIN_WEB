  <rect x="80" y="86" width="20" height="20" rx="2" fill="#cf4318"/>
  <text x="116" y="104" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="600" fill="#17150f">Apoliak</text>

  <text x="80" y="290" font-family="Georgia,'Palatino Linotype',serif" font-size="76" font-weight="600" fill="#17150f">Weby, ktoré vyzerajú draho</text>
